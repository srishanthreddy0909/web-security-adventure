<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{company}} • Web Security Adventure</title><link rel="stylesheet" href="{{url_for('static',filename='app.css')}}"></head><body><nav><a class="brand" href="{{url_for('dashboard') if me else url_for('login')}}">🎮 {{company}}</a>{% if me %}<div class="navright"><span>{{me['username']}}</span><a href="{{url_for('dashboard')}}">Adventure</a><a href="{{url_for('logout')}}">Exit</a></div>{% elif session.get('admin_id') %}<div class="navright"><span>🔐 {{session.get('admin_id')}}</span><a href="{{url_for('admin')}}">HQ</a><a href="{{url_for('admin_logout')}}">Exit</a></div>{% endif %}</nav><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
